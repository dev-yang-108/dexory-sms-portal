<!doctype html>

<title>DEX05110160 label</title>
<style>
  :root{--navy:#0B1A48;--border:#0B1A48;}
  @page{size:150mm 100mm;margin:0;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#eee;}
  .label{
    width:150mm;height:100mm;margin:10mm auto;padding:6mm 7mm;
    background:#fff;border:3px solid var(--navy);border-radius:10px;
    display:grid;grid-template-columns:1fr 38mm;gap:4mm;
    position:relative;color:var(--navy);
  }
  .main{display:flex;flex-direction:column;gap:3mm;min-width:0;}
  .brand{font-size:22px;font-weight:800;letter-spacing:.02em;}
  .tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--navy);text-align:right;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .barcode-row{display:flex;align-items:center;gap:4mm;}
  .barcode-row svg{height:14mm;width:auto;}
  .partno{font-family:"Consolas","IBM Plex Mono",monospace;font-size:20px;font-weight:800;}
  .photo-box{
    flex:1;border:1.5px dashed #9aa5bd;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#9aa5bd;min-height:22mm;
  }
  .partname-label{font-size:9px;font-weight:700;letter-spacing:.05em;color:#6b7a90;}
  .partname{font-size:15px;font-weight:700;line-height:1.2;}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);border:1.5px solid var(--navy);border-radius:6px;overflow:hidden;}
  .sb{border-right:1.5px solid var(--navy);padding:2mm 1.5mm;text-align:center;}
  .sb:last-child{border-right:none;}
  .sb-label{font-size:7px;font-weight:700;letter-spacing:.03em;color:#6b7a90;}
  .sb-value{font-size:13px;font-weight:800;margin-top:1mm;}
  .material{font-size:9px;color:#6b7a90;text-align:right;margin-top:1mm;}
  .infocol{display:flex;flex-direction:column;gap:1.5mm;}
  .ib{border:1.5px solid var(--navy);border-radius:4px;flex:1;padding:1.5mm;}
  .ib-label{font-size:7px;font-weight:700;letter-spacing:.03em;}
  @media print{body{background:#fff;}.label{margin:0;border-width:2px;}}
</style>
</head>
